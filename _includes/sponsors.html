{% if page.sponsors %}
{% assign sponsors=site.data.[page.sponsors] %}
    <div class="columns is-multiline">
        <div class="column is-12">
            <p class="title is-3 has-text-centered">
                <span>Merci beaucoup à nos sponsors !</span>
            </p>
            <p class="subtitle has-text-centered">
                <span class="icon is-large gh-sponsor"><i class="fas fa-heart fa-2x"></i></span>
            </p>

            {% for sponsor in sponsors %}

            <div class="box has-text-centered">
                <div class="columns">
                    <div class="column is-one-quarter">
                        <p class="title">
                            <a href="{{ sponsor.link }}" class="is-link">{{ sponsor.name }}</a>
                        </p>
                        {% for filename in sponsor.img %}
                        <img src="img/sponsors/{{ filename }}" alt="{{ filename }}" width="100" height="100">
                        {% endfor %}
                    </div>
                    <div class="column is-three-quarters">
                        <p class="subtitle">
                            {{ sponsor.description | markdownify }}
                        </p>
                    </div>
                </div>
            </div>

            {% endfor %}
        </div>
        <div class="column is-12">
            <hr />
        </div>
    </div>
{% endif %}
