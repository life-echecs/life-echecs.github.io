title: LIFE

baseurl: "" # the subpath of your site, e.g. /blog
url: "https://life-echecs.org" # the base hostname & protocol for your site, e.g. http://example.com

lang: "fr"
locale: "fr"

author:
  name: Jean Heibig
  email: jean@life-echecs.org
description: > # this means to ignore newlines until "show_excerpts:"
  Bienvenue sur le site de la Ligue Ingénieure Française d'Échecs !
  Nous organisons chaque année un tournoi d'échecs où les élèves d'écoles
  d'ingénieurs s'affrontent par équipes et tentent de remporter des prix
  ainsi que du prestige pour leur école.

show_excerpts: false # set to true to show excerpts on the homepage

